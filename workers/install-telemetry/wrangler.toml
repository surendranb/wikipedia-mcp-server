name = "wikipedia-mcp-telemetry"
main = "src/index.js"
compatibility_date = "2026-05-01"
workers_dev = true

routes = [
  { pattern = "wikipedia-mcp.builditwithai.xyz", custom_domain = true }
]

[vars]
# POSTHOG_API_KEY is a Wrangler secret: npx wrangler secret put POSTHOG_API_KEY
POSTHOG_HOST = "https://us.i.posthog.com"
GITHUB_REPO = "https://github.com/surendranb/wikipedia-mcp-server"
DOCS_URL = "https://github.com/surendranb/wikipedia-mcp-server"
